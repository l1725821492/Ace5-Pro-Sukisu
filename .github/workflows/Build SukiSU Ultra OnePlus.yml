name: Build OnePlus_SukiSU Ultra All
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace5_pro
        options:
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_nord_ce4_v
          - oneplus_nord_4_v
          - oneplus_ace_3v_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus12_v
          - oneplus_13r
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_pad_pro_v
          - oneplus_pad2_v
          - oneplus_nord_5
          - oneplus_ace5_pro
          - oneplus_13
          - oneplus_13t
          - oneplus_13s
          - oneplus_pad_2_pro
          - oneplus_pad_3
      HOOK:
        type: choice
        description: "当前 builtin 分支使用 SUSFS 提供的 manual Hook"
        required: true
        default: manual
        options:
          - manual
      SUSFS_CI:
        type: choice
        description: "下载SUSFS模块调用方式"
        required: true
        default: CI
        options:
          - CI
          - Release
          - NoN
      KSU_META:
        type: string
        description: "分支名(不可留空)/自定义版本标识(留空不修改)"
        required: false
        default: "builtin/@XiaoHu"
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前时间)"
        required: false
        default: "Mon May 12 09:09:59 UTC 2025"
      SUFFIX:
        type: string
        description: "自定义内核后缀 (不输入使用随机字符串)"
        required: false
        default: "8-g4dc61d72e02f-abogki415959920-4k"
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      KPM:
        type: boolean
        description: "是否启用内核模块(KPM)？"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "是否添加风驰驱动？"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "是否添加更多ZRAM算法？"
        required: true
        default: true

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ github.event.inputs.SCHED == 'true' && ' [SCHED]' || '' }}${{ github.event.inputs.ZRAM == 'true' && ' [ZRAM]' || '' }}${{ github.event.inputs.KPM == 'true' && ' [KPM]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Compatibility Patches
        run: |
          mkdir -p "$RUNNER_TEMP/compat-patches"
          cp "$GITHUB_WORKSPACE/patches/sched_ext_6.1_compat.patch" "$RUNNER_TEMP/compat-patches/"

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup Multiple SSH Keys
        run: |
         mkdir -p ~/.ssh
         echo "${{ secrets.OGKIPATCH }}" > ~/.ssh/id_ogkipatch
         chmod 600 ~/.ssh/id_ogkipatch
         ssh-keyscan github.com >> ~/.ssh/known_hosts

         cat > ~/.ssh/config << EOF
         Host github.com
         HostName github.com
         User git
         IdentityFile ~/.ssh/id_ogkipatch
         IdentitiesOnly yes
         EOF

         # 验证配置
         cat ~/.ssh/config
          

      - name: Extract OnePlus Manifest Info
        id: extract_info
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          FILE="${{ github.event.inputs.FILE }}"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          echo "🌐 拉取 OnePlus Manifest 分支列表..."
          BRANCHES=$(gh api repos/OnePlusOSS/kernel_manifest/branches --paginate --jq '.[].name')

          FOUND=""
          for BRANCH in $BRANCHES; do
            XML_URL="https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/$BRANCH/${FILE}.xml"
            README_URL="https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/$BRANCH/README.md"
            if curl -sf --head "$XML_URL" > /dev/null; then
              echo "✅ XML: $BRANCH"
              curl -fsSL -o "$XML_PATH" "$XML_URL"
              curl -fsSL -o "$README_PATH" "$README_URL"
              FOUND="$BRANCH"
              break
            fi
          done

          if [[ -z "$FOUND" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法找到 ${FILE}.xml"
            exit 1
          fi
          echo "📥 下载完成，开始提取 revision..."

          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          CPU=$(echo "$REVISION" | sed -E 's#^oneplus/([^_]+).*#\1#')
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -z "$CPU" || -z "$ANDROID_VERSION" ]]; then
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            exit 1
          fi
          echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
          echo "CPU=$CPU" >> $GITHUB_ENV
          echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
          echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV

          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
          if [[ -z "$BUILD_LINE" ]]; then
            echo "❌ README.md 中未找到构建命令"
            exit 1
          fi
          CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
          BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
          if [[ -z "$CPUD" || -z "$BUILD_METHOD" ]]; then
            echo "❌ 无法解析 CPUD 或 BUILD_METHOD"
            exit 1
          fi
          echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
          echo "CPUD=$CPUD" >> $GITHUB_ENV
          echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
          # 传递组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          echo "-----------------------"
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Custom BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}"
          echo -n "BUILD_TIME Unicode: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.BUILD_TIME }}'''))"
          echo "Custom SUFFIX: ${{ github.event.inputs.SUFFIX }}"
          echo -n "SUFFIX Unicode: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.SUFFIX }}'''))"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected HOOK: ${{ github.event.inputs.HOOK }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED: ${{ github.event.inputs.SCHED }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "-----------------------"

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Configure APTC
        run: |
          APT_CACHE_DIR="$HOME/apt-cache"
          mkdir -p "$APT_CACHE_DIR"/{archives,lists/partial}
          echo "Dir::Cache \"$APT_CACHE_DIR\";" | sudo tee /etc/apt/apt.conf.d/90user-cache
          echo "Dir::Cache::archives \"$APT_CACHE_DIR/archives\";" | sudo tee -a /etc/apt/apt.conf.d/90user-cache
          echo "Dir::State::lists \"$APT_CACHE_DIR/lists\";" | sudo tee -a /etc/apt/apt.conf.d/90user-cache
          echo "Acquire::Check-Valid-Until \"false\";" | sudo tee -a /etc/apt/apt.conf.d/90user-cache
          echo "Acquire::Languages \"none\";" | sudo tee -a /etc/apt/apt.conf.d/90user-cache
          sudo chown -R $USER:$USER "$APT_CACHE_DIR"

      - name: Set APT Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/apt-cache
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/Build SukiSU Ultra OnePlus.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        run: |
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock
          APT_CACHE_DIR="$HOME/apt-cache"
          mkdir -p "$APT_CACHE_DIR/lists/partial"
          sudo apt -o Dir::Cache="$APT_CACHE_DIR" update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt -o Dir::Cache="$APT_CACHE_DIR" install -yq --no-install-recommends \
            python3 git curl ccache libelf-dev \
            build-essential flex bison libssl-dev \
            libncurses-dev lz4 zlib1g-dev \
            libxml2-utils rsync unzip

      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-15

      - name: Initialize Ccache
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/repo"
          chmod a+x "$HOME/repo"
          sudo mv "$HOME/repo" /usr/local/bin/repo

      - name: Initialize Repo and Sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          FILE="${{ github.event.inputs.FILE }}"
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/${{env.CPU}} -m "${FILE}.xml" --repo-rev=v2.16 --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          if [ -e kernel_platform/common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [ -e kernel_platform/msm-kernel/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm -f kernel_platform/common/android/abi_gki_protected_exports_*
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_*

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          BRANCH=""
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$BRANCH" ] && break
            fi
          done
          if [ -z "$BRANCH" ]; then
            echo "No BRANCH found in build.config files" >&2
            exit 1
          fi
          echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
          echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV

          TKERNEL_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          if [ -z "$TKERNEL_VERSION" ]; then
            echo "Unable to read kernel version" >&2
            exit 1
          fi
          echo "Kernel Version: $TKERNEL_VERSION"
          echo "TKERNEL_VERSION=$TKERNEL_VERSION" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d= -f2 || true)
          if [ -z "$RUSTC_VERSION" ]; then
            echo "RUSTC_VERSION 未配置，不添加 Rust 编译参数"
            exit 0
          fi
          RUSTC_DIR_VERSION=$(echo "$RUSTC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          RUSTC_DIR_VERSION="${RUSTC_DIR_VERSION:-$RUSTC_VERSION}"
          RUST_BIN_DIR="$PWD/prebuilts/rust/linux-x86/$RUSTC_DIR_VERSION/bin"
          if [ ! -x "$RUST_BIN_DIR/rustc" ] || [ ! -x "$RUST_BIN_DIR/bindgen" ]; then
            echo "Rust 工具链缺失: $RUST_BIN_DIR" >&2
            exit 1
          fi
          echo "RUSTC_BIN=$RUST_BIN_DIR/rustc" >> $GITHUB_ENV
          echo "BINDGEN_BIN=$RUST_BIN_DIR/bindgen" >> $GITHUB_ENV

      # 自定义内核后缀
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.SUFFIX != '' }}
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"

            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$path"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi

            chmod +x "$path"
          done

      # 伪官方格式的随机后缀（仅在 SUFFIX 未设置时生效）*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$path"

            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$path"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$path"
            fi

            chmod +x "$path"
          done

      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform

          META="${{ github.event.inputs.KSU_META }}"
          BRANCH_NAME="${META%%/*}"
          CUSTOM_TAG="${META#*/}"
          echo "分支名: $BRANCH_NAME"
          echo "自定义版本标识: $CUSTOM_TAG"

          curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH_NAME"
          cd ./KernelSU
          EXPECTED_KSU_HEAD=$(git rev-parse "origin/$BRANCH_NAME")
          ACTUAL_KSU_HEAD=$(git rev-parse HEAD)
          if [ "$ACTUAL_KSU_HEAD" != "$EXPECTED_KSU_HEAD" ]; then
            echo "SukiSU 分支检出失败: $BRANCH_NAME" >&2
            exit 1
          fi

          KSU_API_VERSION=$(gh api repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest --jq '.tag_name | ltrimstr("v")')
          if [ -z "$KSU_API_VERSION" ]; then
            echo "无法获取 SukiSU Release 版本" >&2
            exit 1
          fi
          echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "GIT_HASH=$GIT_HASH"
          if [[ -z "$CUSTOM_TAG" || "$CUSTOM_TAG" == "$BRANCH_NAME" ]]; then
            VERSION_FULL="v$KSU_API_VERSION-$GIT_HASH@$BRANCH_NAME"
          else
            VERSION_FULL="v$KSU_API_VERSION-$CUSTOM_TAG@$BRANCH_NAME[$GIT_HASH]"
          fi

          ESC_VERSION_FULL=$(printf '%s' "$VERSION_FULL" | sed 's/[&|\\/]/\\&/g')
          grep -q '^KSU_VERSION_FULL := ' kernel/Makefile
          sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|" kernel/Makefile

          KSU_VERSION_BASE=40000
          KSU_VERSION_OFFSET=2815
          MAIN_COMMIT_COUNT=$(git rev-list --count main)
          KSU_VERSION=$(expr "$MAIN_COMMIT_COUNT" + "$KSU_VERSION_BASE" - "$KSU_VERSION_OFFSET")
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          echo "::group::最终 Makefile 中版本信息及部分调试结果预览"
          grep -A10 "REPO_OWNER" kernel/Makefile
          grep "KSU_VERSION_FULL" kernel/Makefile
          echo "::endgroup::"

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "正在拉取susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          SUSFS_PATCH="50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch"
          GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')

          if [ "$GKI_V" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复内核版本5.15.0到5.15.123仅支持旧版C库造成的一些bug"
            curl -fLo fix_5.15.legacy.patch --retry 5 --retry-delay 2 --retry-connrefused https://raw.githubusercontent.com/Numbersf/Action-Build/SukiSU-Ultra/patches/fix_5.15.legacy
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch完成"
          fi
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          TKERNEL_VERSION="${{ env.TKERNEL_VERSION }}"
          file="${{ github.event.inputs.FILE }}"
          TRUSTY_EXISTS="false"
          if [[ "$KERNEL_VERSION" == "6.6" ]]; then
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${file}.xml"; then
              TRUSTY_EXISTS="true"
            fi
            echo "trusty_exists=$TRUSTY_EXISTS" >> $GITHUB_OUTPUT

            if [[ "$TRUSTY_EXISTS" == "false" && "$(printf '%s\n' "$TKERNEL_VERSION" "6.6.30" | sort -V | head -n1)" = "$TKERNEL_VERSION" ]]; then
              echo "修复内核版本6.6部分机型缺失Trusty OS导致的susfs的报错"
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' "$SUSFS_PATCH"
              sed -i '/#include <trace\/hooks\/fs.h>/d' "$SUSFS_PATCH"
            fi
          fi

          if ! grep -q '^#include <trace/hooks/blk.h>' fs/namespace.c; then
            sed -i 's/^@@ -32,11 +32,21 @@/@@ -32,10 +32,20 @@/' "$SUSFS_PATCH"
            sed -i '/^ #include <trace\/hooks\/blk.h>$/d' "$SUSFS_PATCH"
          fi
          if ! grep -q '^#include <linux/dma-buf.h>' fs/proc/base.c; then
            sed -i '/^diff --git a\/fs\/proc\/base.c /,/^diff --git a\/fs\/proc\/bootconfig.c /{s/^@@ -100,6 +100,10 @@/@@ -100,5 +100,9 @@/; /^ #include <linux\/dma-buf.h>$/d;}' "$SUSFS_PATCH"
          fi

          echo "正在打susfs补丁"
          patch -p1 < "$SUSFS_PATCH"
          echo "susfs_patch完成"

      - name: Apply Hide Stuff Patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"
          patch -p1 -F 3 < 69_hide_stuff.patch
          echo "隐藏应用_patch完成"

      # OGKI转换GKI，无需修改 dtbo 开机
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ env.KERNEL_VERSION == '6.6' }}
        run: |
         cd kernel_workspace/kernel_platform
         git clone git@github.com:RunRunxka/OGKI-PATCH.git
         rm -rf ./OGKI-PATCH/.git
         rm -rf ./OGKI-PATCH/hmbird_patch.patch
         cd common
         echo "正在打OGKI转换GKI补丁"
         patch -p1 < ../OGKI-PATCH/hmbird_gki.patch
         echo "OGKI转换GKI完成"

      - name: Apply ZRAM
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < lz4kd.patch
          echo 'lz4kd_patch完成'
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4k_oplus.patch ./
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < lz4k_oplus.patch
          echo 'lz4k_oplus_patch完成'

      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          set_config() {
            local value="$1"
            local key="${value%%=*}"
            if grep -qF "${key}=" "$CONFIG_FILE" || grep -qF "# ${key} is not set" "$CONFIG_FILE"; then
              VALUE="$value" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 { print ENVIRON["VALUE"]; next }
                { print }
              ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
            else
              printf '%s\n' "$value" >> "$CONFIG_FILE"
            fi
          }

          set_config "CONFIG_KSU=y"
          if [ "${{ github.event.inputs.KPM }}" = "true" ]; then
            set_config "CONFIG_KPM=y"
          fi

          set_config "CONFIG_KSU_SUSFS=y"
          set_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
          set_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
          set_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
          set_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
          set_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
          set_config "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
          set_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          set_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
          set_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"

          set_config "CONFIG_TMPFS_XATTR=y"
          set_config "CONFIG_TMPFS_POSIX_ACL=y"
          set_config "CONFIG_TCP_CONG_ADVANCED=y"
          set_config "CONFIG_TCP_CONG_BBR=y"
          set_config "CONFIG_NET_SCH_FQ=y"
          set_config "CONFIG_TCP_CONG_BIC=n"
          set_config "CONFIG_TCP_CONG_WESTWOOD=n"
          set_config "CONFIG_TCP_CONG_HTCP=n"
          set_config "CONFIG_IP_ECN=y"
          set_config "CONFIG_TCP_ECN=y"
          set_config "CONFIG_IPV6_ECN=y"
          set_config "CONFIG_IP_NF_TARGET_ECN=y"

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            set_config "CONFIG_CRYPTO_LZ4HC=y"
            set_config "CONFIG_CRYPTO_LZ4K=y"
            set_config "CONFIG_CRYPTO_LZ4KD=y"
            set_config "CONFIG_CRYPTO_842=y"
            set_config "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            set_config "CONFIG_ZRAM_WRITEBACK=y"
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      # 风驰内核，以 sm8750 为主体，其他 CPU 可能无效或者无法跑出
      - name: Add sched_ext
        if: ${{ github.event.inputs.SCHED == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/
          git clone --depth 1 https://github.com/HanKuCha/sched_ext.git
          git -C sched_ext checkout 7ab1d04d5cb6
          cp -r ./sched_ext/* ./common/kernel/sched
          rm -rf ./sched_ext/.git
          if [ "${{ env.KERNEL_VERSION }}" = "6.1" ]; then
            patch -p1 -d common < "$RUNNER_TEMP/compat-patches/sched_ext_6.1_compat.patch"
          fi
          cd common/kernel/sched

      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Enable lto=thin For FAST
        if: ${{ (env.KERNEL_VERSION == '5.10' || env.KERNEL_VERSION == '5.15') && github.event.inputs.FAST_BUILD == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform
          DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
          echo "Enabling ThinLTO in $DEFCONFIG"
          sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
          grep -q '^CONFIG_LTO_CLANG_THIN=y' "$DEFCONFIG" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$DEFCONFIG"

      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform

          # 自动检测 LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # 从 build.config.common 读取 CLANG_PREBUILT_BIN
          CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2 || true)
          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            echo "⚠️ CLANG_PREBUILT_BIN 未在 build.config.common 中找到，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭 FAST_BUILD 并提交问题"
            exit 0
          fi

          # 优先尝试从 CLANG_PREBUILT_BIN 提取 clang-r 版本
          if [[ "$CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从 build.config.constants 提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭 FAST_BUILD 并提交问题"
            exit 0
          fi

          # 替换成新的 CLANG_VERSION 值
          CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}
          # 获取 CLANG_PREBUILT_BIN 的第一个目录名，赋值给 CLANG_DIR
          CLANG_DIR=$(echo "$CLANG_PREBUILT_BIN" | cut -d'/' -f1)
          # 获取 CLANG_PREBUILT_BIN 的上一级目录名，赋值给 CLANG_PATH
          CLANG_PATH=$(basename "$(dirname "$CLANG_PREBUILT_BIN")")

          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ CLANG_DIR=$CLANG_DIR"
          echo "✅ CLANG_PATH=$CLANG_PATH"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          sudo apt install -y libelf-dev ccache

          cd ./common
          sed -i 's/^\([[:space:]]*\)char \*next_path;/\1const char *next_path;/' tools/lib/bpf/libbpf.c
          grep -q 'const char \*next_path;' tools/lib/bpf/libbpf.c
          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole
            LD=ld.lld
            HOSTLD=ld.lld
            KCFLAGS+=-Wno-error
          )
          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
          fi
          if [[ -n "${RUSTC_BIN:-}" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTC_BIN" BINDGEN="$BINDGEN_BIN")
          fi

          REQUIRED_CONFIGS=(
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_SUS_MAP=y
          )
          if [ "${{ github.event.inputs.KPM }}" = "true" ]; then
            REQUIRED_CONFIGS+=(CONFIG_KPM=y)
          fi
          if [ "${{ github.event.inputs.SCHED }}" = "true" ]; then
            REQUIRED_CONFIGS+=(CONFIG_SCHED_CLASS_EXT=y)
          fi
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            REQUIRED_CONFIGS+=(
              CONFIG_CRYPTO_LZ4K=y
              CONFIG_CRYPTO_LZ4KD=y
              CONFIG_CRYPTO_LZ4K_OPLUS=y
              CONFIG_ZRAM_WRITEBACK=y
            )
          fi

          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}" gki_defconfig
          for expected in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -qxF "$expected" out/.config; then
              echo "必需配置未生效: $expected" >&2
              exit 1
            fi
          done
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s

      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          image_source=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" -print -quit)
            if [ -n "$image_path" ]; then
              image_source="fast"
              echo "使用 make 编译的统一路径，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" -print -quit)
            if [ -n "$image_path" ]; then
              image_source="official"
              echo "使用官方脚本编译，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] || [ ! -f "$image_path" ]; then
            echo "未找到 Image 文件，构建失败" >&2
            exit 1
          fi
          echo "Image file finally located at: $image_path"
          cp "$image_path" ./AnyKernel3/Image
          cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image

          if [ "$image_source" = "official" ] && [ "${{ env.CPU }}" = "sm8750" ]; then
            image_dir=$(dirname "$image_path")
            for file in dtbo.img system_dlkm.erofs.img; do
              if [ ! -f "$image_dir/$file" ]; then
                echo "$image_dir/$file 不存在" >&2
                exit 1
              fi
              target_name="$file"
              if [ "$file" = "system_dlkm.erofs.img" ]; then
                target_name="system_dlkm.img"
              fi
              cp "$image_dir/$file" "./AnyKernel3/$target_name"
            done
          fi

      - name: Apply patch_linux and replace Image
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/out/Final-Image-Find
          cp "$GITHUB_WORKSPACE/kernel_workspace/SukiSU_patch/kpm/patch_linux" .
          chmod +x patch_linux
          ./patch_linux
          if [ ! -s oImage ]; then
            echo "patch_linux 未生成有效 oImage" >&2
            exit 1
          fi
          mv -f oImage Image
          cp Image "$GITHUB_WORKSPACE/AnyKernel3/Image"

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' }}
        run: |
          LATEST_RUN_ID=$(gh api \
            "repos/sidex15/susfs4ksu-module/actions/runs?status=success&event=push&per_page=100" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+" >&2
            exit 1
          fi
          ARTIFACT_URL=$(gh api \
            "repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | \
            jq -r '.artifacts[] | select(.name | startswith("release-")) | .archive_download_url' | head -n 1)
          if [ -z "$ARTIFACT_URL" ]; then
            echo "Failed to find SUSFS release artifact" >&2
            exit 1
          fi
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
          cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' }}
        run: |
          curl -fL -o ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest SukiSU-Ultra APK from CI
        run: |
          run_id=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&event=push&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful manager workflow run found" >&2
            exit 1
          fi
          artifact_url=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | \
            jq -r '.artifacts[] | select(.name == "Manager") | .archive_download_url' | head -n 1)
          if [ -z "$artifact_url" ]; then
            echo "No Manager artifact found in run $run_id" >&2
            exit 1
          fi
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -o Manager.zip "$artifact_url"
          unzip -j Manager.zip "*.apk" -d ./AnyKernel3/

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}${{ github.event.inputs.KPM == 'true' && '_KPM' || '' }}${{ github.event.inputs.HOOK == 'manual' && '_VFS' || '' }}${{ github.event.inputs.SCHED== 'true' && '_SCHED' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.TKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
          if-no-files-found: error

      - name: Download and Unzip ZRAM
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
          download_url=$(gh api repos/FurLC/ZRAM-Module/releases/latest | \
            jq -r '.assets[] | select(.name | test("^ZRAM-Module-.*\\.zip$")) | .browser_download_url' | head -n 1)
          if [ -z "$download_url" ]; then
            echo "未找到 ZRAM 模块下载地址" >&2
            exit 1
          fi
          curl -fL -o ZRAM-Module.zip "$download_url"
          unzip ZRAM-Module.zip -d ZRAM-Module

          target="./ZRAM-Module/zram/zram.ko"
          zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" -print -quit)
          if [ -z "$zram_path" ] || [ ! -f "$zram_path" ]; then
            echo "未找到 zram.ko 文件" >&2
            exit 1
          fi
          echo "ZRAM module file finally located at: $zram_path"
          mkdir -p "$(dirname "$target")"
          cp "$zram_path" "$target"
          test -s "$target"

      - name: Upload ZRAM Module
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*
          if-no-files-found: error

      - name: Post-build Disk Check
        run: df -h
